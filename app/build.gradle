apply plugin: 'com.android.application'
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.firebase.crashlytics'
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.bumbumapps.videoeditor'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.videoeditor"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    buildTypes {
        debug {
            // Google sample IDs: debug builds never request live ads.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~8242715273"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/8366800364"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.github.bumptech.glide:glide:3.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.apache.httpcomponents:httpcore:4.4.13'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    // was com.xw.repo:bubbleseekbar (jcenter); same sources/package via jitpack
    implementation 'com.github.woxingxiao:BubbleSeekBar:3.20'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.ogaclejapan.smarttablayout:library:1.7.0@aar'
    implementation 'com.ogaclejapan.smarttablayout:utils-v4:1.7.0@aar'
    implementation 'com.github.lawloretienne:discreteslider:0.0.9'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    implementation 'com.hovans.dynamicgrid:dynamicgrid:1.0.0'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'
    implementation 'com.edmodo:cropper:1.0.0'
    implementation 'com.github.iammert:ScalingLayout:1.2.1'

    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // Play Core 1.x is incompatible with targetSdk 34+; in-app updates moved to app-update.
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'

    // mobile-ffmpeg / ffmpeg-kit were retired and removed from Maven Central (and are not
    // 16 KB page aligned). Maintained 16 KB-aligned FFmpegKit fork; the old
    // com.arthenica.mobileffmpeg API is kept by a small in-app adapter.
    implementation 'com.antonkarpenko:ffmpeg-kit-full-gpl:2.2.3'
    implementation 'com.arthenica:smart-exception-java:0.1.0'

    testImplementation 'junit:junit:4.13.2'
}
